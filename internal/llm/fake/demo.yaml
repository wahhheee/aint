# 内置演示脚本（aint --fake-llm demo），配合《倒悬的街角》的默认开场。
# 按固定顺序演示正文、状态面板、选项、场外回应与记忆整理。
responses:
  - first_delay_ms: 700
    chunk_runes: 3
    delay_ms: 28
    text: |
      克莱尔把热茶推到你面前，另一只手按着桌上的信封。

      「先看这个。送信的人给了五枚银币，只说要你亲自拆。」

      信纸带着极淡的香气。落款是上层圣咏歌剧院，约见的地方却在灰羽街区。楼下风铃轻响，有人停在门外，没有敲门。
    tool_calls:
      - name: update_state
        args: {op: set, path: situation, value: 歌剧院来信，门外有人等候}
      - name: offer_choices
        args:
          choices:
            - {id: a, label: 读完来信，问克莱尔送信人的模样}
            - {id: b, label: 下楼看看门外的人}
            - {id: c, label: 先和克莱尔商量今晚的安排}
  - first_delay_ms: 500
    chunk_runes: 3
    delay_ms: 26
    text: |
      木门打开时，巷子里的灯刚亮。来客穿着旅行斗篷，递来一枚刻着水闸纹样的铜牌。

      「有人今天去过二层的旧水闸。您若想知道是谁，明天白昼之前到升降台找我。」

      她没有等你追问便转身离开。克莱尔倚在楼梯边，看着你掌心的铜牌，把本来要说的话咽了回去。
    tool_calls:
      - name: update_state
        args: {op: append, path: memos, value: 明天白昼前在升降台寻找送来水闸铜牌的人}
      - name: update_state
        args: {op: set, path: situation, value: 水闸铜牌与明日的约见}
      - name: offer_choices
        args:
          choices:
            - {id: a, label: 问克莱尔是否认得铜牌}
            - {id: b, label: 去黑荆棘馆打听旧水闸}
            - {id: c, label: 收好铜牌，准备明天的行囊}
ooc:
  first_delay_ms: 300
  chunk_runes: 8
  delay_ms: 20
  text: |
    <ooc>收到：「{{input}}」。当前使用固定演示脚本。连接自己的模型后，执笔者会结合你的输入继续故事。</ooc>
compact:
  - delay_ms: 100
    tool_calls:
      - name: write
        args:
          path: /memory/chronicle/01-alley.md
          content: |
            # 鸦羽巷的来信
            - 事务所收到来自圣咏歌剧院的约见信。
            - 一位来客送来水闸铜牌，约在明天白昼前到升降台见面。
  - first_delay_ms: 100
    chunk_runes: 20
    delay_ms: 10
    text: |
      ## 故事至今
      玩家和克莱尔在灰羽事务所收到歌剧院来信，以及一位来客送来的水闸铜牌。
      ## 当前场景
      鸦羽巷七号事务所，雨后的暮色。明天白昼前可以去升降台赴约。
      ## 人物与关系
      克莱尔是住店搭档，关心来信与铜牌的来历。
      ## 线索·伏笔·承诺
      歌剧院的约见、二层旧水闸的新动静、铜牌送信人。
      ## 玩家
      玩家决定接下来调查哪个方向。
      ## 写作备忘
      保持人物对白与街区生活的细节，资料见 /memory/chronicle/01-alley.md。
