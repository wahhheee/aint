# 内置演示脚本（yanyi --fake-llm demo）。
# 内容配合内置示例《雾港来信》，覆盖：场景标记、台词、作品样式标签、场景分隔、选项、场外回应。
responses:
  - first_delay_ms: 700
    chunk_runes: 3
    delay_ms: 28
    text: |
      <scene bg="harbor-night" title="第一夜 · 雾"/>

      雾是从傍晚开始漫上来的。先是码头上的缆桩看不清了，接着是对街的路灯，最后连邮局门口那块褪了色的招牌，也只剩下一团昏黄的光晕。

      林舟推门进来的时候，带进了一股潮湿的冷气。他把湿透的帽子挂上衣架，水珠沿着帽檐一颗一颗往下落，在木地板上洇出一小圈深色。

      <say who="lin">「你也收到了那封信？」</say>

      他没有看你，只是盯着柜台上那盏煤油灯，像是在等它先开口。灯芯噼啪响了一声。

      你注意到他的右手一直揣在口袋里，袖口有一道新鲜的擦痕。

      ---

      墙上的挂钟走到十一点四十分。柜台后面，老陈的椅子空着，椅背上搭着他那件从不离身的灰呢外套。

      <gold>老陈在午夜前从未离开过柜台。</gold>
    tool_calls:
      - name: offer_choices
        args:
          prompt: 雾还在变浓。
          choices:
            - {id: a, label: 追问他手上的伤, detail: 他下意识把手往口袋深处藏了藏}
            - {id: b, label: 装作不在意，去看信件柜}
            - {id: c, label: 把那封信拿给他看}

  - first_delay_ms: 500
    chunk_runes: 3
    delay_ms: 26
    text: |
      林舟沉默了很久。久到你以为他不会回答了。

      <say who="lin">「三年前的那个晚上，雾也是这么大。」</say>他终于开口，声音很轻，「船没有回来。名单上……本来应该有我。」

      他把手从口袋里抽出来。掌心里躺着一把银色的钥匙，锈迹斑斑，齿痕却磨得发亮，像是被人反复握过许多次。

      <aside>远处传来一声汽笛，低沉、悠长，在雾里绕了很久才散去。</aside>

      <say who="lin">「这是在缆绳下面捡到的。就在今天傍晚，老陈不见之前。」</say>
    tool_calls:
      - name: offer_choices
        args:
          prompt: 钥匙在灯下泛着冷光。
          choices:
            - {id: a, label: 接过钥匙，仔细端详}
            - {id: b, label: 问他为什么现在才说}
            - {id: c, label: 提议一起去码头看看, detail: 午夜就快到了}

  - first_delay_ms: 600
    chunk_runes: 3
    delay_ms: 26
    text: |
      <scene bg="post-office" title="邮局 · 午夜前"/>

      你们一前一后穿过雾。脚下的石板路湿滑，远处灯塔的光每隔七秒扫过一次，把雾照成一片短暂的银白。

      信件柜的第三格是空的。准确地说，是"被清空了"——格子底部留着一圈浅浅的灰痕，形状和一只信封分毫不差。

      <say who="lin">「有人在我们之前来过。」</say>

      你蹲下身，在柜脚边发现了一小片撕下的邮票。邮票上的日期，是明天。
    tool_calls:
      - name: offer_choices
        args:
          choices:
            - {id: a, label: 收起邮票，什么也不说}
            - {id: b, label: 把发现告诉林舟}
            - {id: c, label: 去灯塔, detail: 那道光扫过的间隔似乎变了}

# 玩家场外发言（/ooc）时的回应，不计入上面的循环。
ooc:
  first_delay_ms: 400
  chunk_runes: 3
  delay_ms: 22
  text: |
    <ooc>收到：「{{input}}」。

    接下来我会放慢节奏，把线索藏得更深一些。想回到故事里，直接写下你的行动就好。</ooc>
