# M5 界面回归：短正文、换行与选项，无真实模型调用。
responses:
  - text: |
      雾散了一些。<br/>远处的灯亮了。
      你把信收进口袋，继续沿着码头向前走。
    chunk_runes: 200
    delay_ms: 1
    tool_calls:
      - name: offer_choices
        args:
          choices:
            - {id: a, label: 继续前行}
            - {id: b, label: 停下观察}
compact:
  - text: 玩家沿码头向前，雾渐渐散去。信仍在玩家手里。
    chunk_runes: 200
    delay_ms: 1
ooc:
  text: 重连测试正文。雾中的执笔者正在缓慢记录这次场外交流，等待读者在另一台设备上接着阅读。这段内容会持续生成，直到读者主动停止。
  chunk_runes: 8
  delay_ms: 900

operations:
  rewrite:
    - text: 雨声还在继续。
      chunk_runes: 100
      wait_for_cancel: true
    - text: |
        你停下脚步。雨声渐密，远处那盏灯在水面上晃了一下。
        那封信还在口袋里，你却不急着把它拿出来。
      chunk_runes: 12
      delay_ms: 1
  choices:
    - text: 好的，我来生成选项。
      chunk_runes: 100
      delay_ms: 1
      tool_calls:
        - name: offer_choices
          args:
            choices:
              - {id: a, label: 走近那盏灯}
              - {id: b, label: 留在雨棚下}
