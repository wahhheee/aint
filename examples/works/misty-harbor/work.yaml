format: 1
id: yanyi.misty-harbor
version: 0.1.0
title: 雾港来信
subtitle: 一座被雾封住的港口，一封寄错的信
authors:
  - name: 演义示例
language: zh-CN
description: 你在雾港的邮局醒来，手里攥着一封写给“明天的你”的信。
tags: [悬疑, 群像, 推理]
content_rating: teen
license: CC-BY-NC-4.0
cover: assets/cover.webp
engine: ">=1.0 <2.0"
requires:
  vision: preferred
narrator:
  length: medium
  reasoning: low
opening:
  mode: static
new_game:
  fields:
    - key: player.name
      label: 你的名字
      type: text
      default: 沈遥
      max_length: 12
    - key: player.trait
      label: 你的特长
      type: select
      options: [观察, 话术, 记忆]
      default: 观察
features:
  force_choices: false  # 开启后，正文结束时未给选项会追加提示并继续工具循环
  dice: true
presentation:
  dialogue: tagged
  stage: true
  text_effects: true  # 开场与演示中用到 <aside>（特效默认关闭，D-23）
changelog: |
  0.1.0：内置示例的第一个版本：两张场景背景、封面、地图、信件扫描件与人物剪影（暂无音频）。
