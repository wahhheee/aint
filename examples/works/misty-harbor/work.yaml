format: 1
id: aint.misty-harbor
version: 0.1.0
title: 雾港来信
subtitle: 一座被雾封住的港口，一封寄错的信
authors:
  - name: AINT 示例
language: zh-CN
description: 你在雾港的邮局醒来，手里攥着一封写给“明天的你”的信。
tags: [悬疑, 群像, 推理]
content_rating: teen
license: CC-BY-NC-4.0
cover: assets/cover.webp
engine: ">=2.0 <3.0"
requires:
  vision: preferred
narrator:
  length: medium
  reasoning: low
openings:
  - id: post-office
    title: 邮局醒来
    description: 你攥着一封寄给明天的信，在邮局醒来。
    mode: static
    file: prompts/openings/post-office.md
    initial_state:
      situation: 雾越来越浓，老陈不见了。
  - id: arriving
    title: 乘船入港
    description: 渡船即将靠岸，你第一次来到雾港。
    mode: generate
    file: prompts/openings/arriving.md
    initial_state:
      situation: 渡船即将靠岸，码头上有人正在等你。
      trust.林舟: 0
new_game:
  fields:
    - key: player.name
      label: 你的名字
      type: text
      default: 沈遥
      max_length: 12
    - key: player.trait
      label: 你的特长
      type: select
      options: [观察, 话术, 记忆]
      default: 观察
features:
  force_choices: false  # 开启后，正文结束时未给选项会追加提示并继续工具循环
  dice: true
presentation:
  dialogue: tagged
  stage: true
  text_effects: true  # 开场与演示中用到 <aside>（特效默认关闭，D-23）
changelog: |
  0.1.0：内置示例的第一个版本：两张场景背景、封面、地图、信件扫描件与人物剪影（暂无音频）。
