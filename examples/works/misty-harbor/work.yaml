format: 1
id: yanyi.misty-harbor
version: 0.1.0
title: 雾港来信
subtitle: 一座被雾封住的港口，一封寄错的信
authors:
  - name: 演义示例
language: zh-CN
description: 你在雾港的邮局醒来，手里攥着一封写给“明天的你”的信。
tags: [悬疑, 群像, 推理]
content_rating: teen
license: CC-BY-NC-4.0
engine: ">=0.1 <2.0"
requires:
  vision: none
narrator:
  length: medium
  reasoning: low
opening:
  mode: static
new_game:
  fields:
    - key: player.name
      label: 你的名字
      type: text
      default: 沈遥
      max_length: 12
    - key: player.trait
      label: 你的特长
      type: select
      options: [观察, 话术, 记忆]
      default: 观察
features:
  dice: false
presentation:
  dialogue: tagged
  stage: true
changelog: |
  0.1.0：内置示例的第一个版本（脚手架阶段，素材暂缺）。
