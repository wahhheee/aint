fields:
  protagonist:
    type: object
    fields:
      name:
        type: string
        default: "洛恩"
        desc: "主角的名字，由开局表单设定。"
      origin:
        type: string
        default: "深渊第一斥候"
        desc: "主角在开设事务所之前的过往底色（深渊第一斥候 / 折光塔叛逃的学者 / 自上层放逐的没落贵族）。"
      condition:
        type: string
        default: "精神饱满，佩剑在侧"
        desc: "主角当前的身体状态、左手刻印负荷或伤势（12字以内，随涉险、负伤或休息更新）。"
  day:
    type: number
    default: 1
    desc: "当前是故事开始后的第几天（从 1 开始的整数）。每当夜色过去、迎来次日晨雾时加 1，并同步推进 undercurrents 中的幕后动向。"
  phase:
    type: string
    default: "暮色"
    desc: "当前时辰阶段，按「晨雾 → 白昼 → 暮色 → 夜色」循环流转。随重大行动、远行或小憩自然推进。"
  location:
    type: string
    default: "灰羽街区 · 鸦羽巷7号"
    desc: "当前所在的具体街区、场所或深渊层数（12字以内，显示在顶栏）。"
  silver:
    type: number
    default: 45
    desc: "事务所当前可支配的银币数量。随承接委托、采买物资、酒馆消遣或打点线人增减。"
  situation:
    type: string
    default: "暮雨初歇，巷口灯火渐起"
    desc: "一句话概括眼前的即时氛围或局势（15字以内，显示在顶栏胶囊）。"
  bonds:
    type: map
    values: string
    default:
      克莱尔: "嘴硬心软的住店搭档 · 下午刚在底层黑市吃了瘪"
    desc: "已结识重要人物（尤其是女性角色及新结识面孔）对主角的当前心态、相处距离与近期状态印象。键为人物名，值为20字以内的定性描述（严禁使用好感度数值）；随结识新人物或关系发生微妙变化时更新。"
  items:
    type: list
    items: string
    default:
      - "修长单手直剑"
      - "旧黄铜指北针"
      - "未拆封的象牙白信笺"
    desc: "随身携带的武器、关键信物与重要物品（每条简短清晰，获得或消耗时更新）。"
  memos:
    type: list
    items: string
    default:
      - "上层来信：有人预付五枚银币，约在今晚暮钟后登门商谈"
    desc: "事务所当前接下的委托、重要约定或实质性的大事件进展（每条25字以内，仅在接下新委托、达成约定或解开核心事件时更新，日常闲谈无需每回合添加）。"
  undercurrents:
    type: map
    values: string
    default:
      下城水道的左手草图: "底层黑市流出了雷恩队长左手字迹画出的新暗道草图，克莱尔下午去打探时发现黑水帮和上层的人都在盯这批东西"
      歌剧院灭口案与逃婚千金: "奥黛丽因伴奏师离奇溺亡识破未婚夫索恩的险恶真面目，正暗中来中层街区寻求庇护与破局助力"
      古水闸的私下开启: "深渊二层封锁了四十年的古水闸被人偷偷抹油开启，薇薇安正借采样之名带人去查谁在私下潜入深层"
    desc: "幕后世界动向账本（不直接展示在玩家面板上）。记录各条暗线与不在场角色此刻在幕后推进到了哪一步。随 day 与 phase 自然演进；旧事件落幕后根据玩家此前的选择衍生新的城中动向。"
