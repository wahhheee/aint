# golangci-lint 配置（CI 中运行；本地可选安装：https://golangci-lint.run）
version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*os.File).Close
formatters:
  enable:
    - gofmt
