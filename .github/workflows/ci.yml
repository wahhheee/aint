# 持续集成：Go 测试（三平台）、Go 静态检查、前端检查与测试、六平台交叉编译。
# 静态检查与本地 `task lint` 相同（golangci-lint 版本见 Taskfile.yml 的 GOLANGCI_VERSION）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go 测试（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        # 各平台都跑一次：覆盖按操作系统区分的源文件（格式与其余检查在 golangci-lint 任务中）
        run: go vet ./...
      - name: go test
        # -race 需要 cgo；Windows 运行器没有 C 工具链，跳过竞态检测
        run: go test ${{ runner.os != 'Windows' && '-race' || '' }} ./...

  golangci:
    name: Go 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go.mod 整洁
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0 # 与 Taskfile.yml 的 GOLANGCI_VERSION 一致

  web:
    name: 前端检查与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  e2e:
    name: 浏览器端到端（假模型）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results

  cross:
    name: 交叉编译
    needs: [web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [windows/amd64, windows/arm64, darwin/amd64, darwin/arm64, linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: go build
        env:
          CGO_ENABLED: "0"
        run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/}
          go build -trimpath -ldflags "-s -w" -o /tmp/yanyi ./cmd/yanyi
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
